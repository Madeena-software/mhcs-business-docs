name: Deploy Pages

on:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python website/test_site.py

      - name: Configure AI demonstration link
        env:
          AI_DEMO_URL: ${{ secrets.AI_DEMO_URL }}
        run: |
          if [ -z "$AI_DEMO_URL" ]; then
            echo "AI_DEMO_URL is required before the Pages artifact can be uploaded."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          url = os.environ["AI_DEMO_URL"].strip()
          parts = urlsplit(url)
          if parts.scheme not in {"http", "https"} or not parts.netloc or any(char in url for char in "\r\n"):
              raise SystemExit("AI_DEMO_URL must be an absolute http(s) URL.")
          Path("website/demonstrator/config.js").write_text(
              "window.MHCS_DEMO_CONFIG = Object.freeze({ aiDemoUrl: "
              + json.dumps(url)
              + " });\n",
              encoding="utf-8",
          )
          PY

      - name: Setup Pages
        id: setup_pages
        continue-on-error: true
        uses: actions/configure-pages@v4

      - name: Setup Pages (retry)
        if: steps.setup_pages.outcome == 'failure'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
